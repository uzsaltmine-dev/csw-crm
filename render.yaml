# Render Blueprint — jonli demo (bepul Hobby reja).
# Ulash: render.com → New → Blueprint → shu repo. Har push'da avtomatik qayta deploy bo'ladi.
# PR preview muhitlari Hobby rejada yo'q (Render: "Preview Environments are not available for Hobby workspaces").

services:
  - type: web
    name: csw-crm-demo
    runtime: docker
    plan: free
    region: frankfurt        # Toshkentga eng yaqin
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET
        generateValue: true
